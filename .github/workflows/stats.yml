name: Stats

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Creates the beacons release and any 1-byte file listed in beacons.json that is missing
      - name: Update beacons
        run: python3 beacons.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect stats
        run: python3 stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commits made with GITHUB_TOKEN do not start new runs, so this does not loop with the push trigger
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          git diff --cached --quiet || { git commit -m "Stats $(date -u +%F)" && git push; }
